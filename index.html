<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La solución a nuestros problemas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F6B55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La solución">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  /* layout: sticky header + tab strip, one column of cards (max 640px); each person tints their own cards */
  --bg:#F0F2EC; --surface:#FFFFFF; --surface-alt:#E6EAE1; --border:#D6DCCF;
  --fg:#20261F; --fg-muted:#5C6657;
  --accent:#2F6B55; --accent-fg:#FFFFFF;
  --person-a:#D9622B; --person-b:#2B78B8;
  --good:#2E7D4F; --good-soft:#DCEBDF;
  --warn:#9C6B0F; --warn-soft:#F2E3C4;
  --danger:#B23C2E; --danger-soft:#F3D9D3;
  --gold:#B8860B;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Karla', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13170F; --surface:#1B2016; --surface-alt:#232A1C; --border:#333D28;
    --fg:#E7EBE0; --fg-muted:#9FAB92;
    --accent:#64C398; --accent-fg:#0D1A12;
    --good:#67C68C; --good-soft:#1E3324;
    --warn:#E0B24C; --warn-soft:#3A2F15;
    --danger:#E2847A; --danger-soft:#3A201A;
    --gold:#E3B74A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13170F; --surface:#1B2016; --surface-alt:#232A1C; --border:#333D28;
  --fg:#E7EBE0; --fg-muted:#9FAB92;
  --accent:#64C398; --accent-fg:#0D1A12;
  --good:#67C68C; --good-soft:#1E3324;
  --warn:#E0B24C; --warn-soft:#3A2F15;
  --danger:#E2847A; --danger-soft:#3A201A;
  --gold:#E3B74A;
  color-scheme: dark;
}
:root{
  --person-a-soft: color-mix(in srgb, var(--person-a) 15%, var(--surface));
  --person-b-soft: color-mix(in srgb, var(--person-b) 15%, var(--surface));
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--fg)}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  min-height:100vh;
}
h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance}
button{font-family:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--fg-muted); font-size:12.5px}
.eyebrow{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-muted)}

#topbar{
  position:sticky; top:0; z-index:9;
  background:var(--surface); border-bottom:1px solid var(--border);
  margin:0 -16px; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:8px}
.topbar-row h1{font-size:clamp(17px, 4.8vw, 22px); line-height:1.15; color:var(--accent)}
.topbar-row > div{min-width:0}
.topbar-sub{font-size:12px; color:var(--fg-muted); display:flex; align-items:center; gap:6px}
.icon-btn{
  background:none; border:1px solid var(--border); border-radius:10px;
  width:38px; height:38px; font-size:17px; color:var(--fg);
  display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.icon-btn:active{transform:scale(0.96)}
#tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex:1 0 auto; background:none; border:none; padding:9px 10px 10px;
  font-size:13.5px; font-weight:600; color:var(--fg-muted); white-space:nowrap;
  border-bottom:3px solid transparent;
}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent)}
main{max-width:640px; margin:0 auto; padding:16px 0 56px}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px}
.section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-muted); margin:20px 0 8px}
.empty{color:var(--fg-muted); font-size:14px; padding:14px 2px}
.avatar{
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  width:32px; height:32px; border-radius:50%; color:#fff; font-weight:700; font-size:14px;
  font-family:var(--font-body);
}
.avatar.sm{width:22px; height:22px; font-size:11px}

.hero{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.hero-title{font-family:var(--font-display); font-size:20px; font-weight:700}
.hero-sub{font-size:13px; color:var(--fg-muted)}
.chips{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}
.chip{border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:6px 12px; font-size:13px; font-weight:600; color:var(--fg-muted); display:inline-flex; align-items:center; gap:6px}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.extra-btn{width:100%; margin:4px 0 4px; padding:11px; border:1.5px dashed var(--accent); background:none; color:var(--accent); border-radius:12px; font-weight:700; font-size:14px}

.task-card{display:flex; gap:12px; align-items:flex-start; border-color:transparent}
.task-main{flex:1; min-width:0}
.task-title{font-weight:700; font-size:15.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.task-meta{font-size:12.5px; color:var(--fg-muted); margin-top:2px}
.task-actions{margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.pts{font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--surface); color:var(--gold); border:1px solid var(--border); font-variant-numeric:tabular-nums; white-space:nowrap}
.pill{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; letter-spacing:.02em; white-space:nowrap}
.pill-overdue{background:var(--danger-soft); color:var(--danger)}
.pill-new{background:var(--accent); color:var(--accent-fg)}
.pill-extra{background:var(--surface-alt); color:var(--fg-muted)}
.pill-help{background:var(--good-soft); color:var(--good)}
.btn{border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--fg); font-size:13.5px; font-weight:700; padding:9px 14px}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn-ghost{background:none; border:none; color:var(--fg-muted); padding:6px 8px; text-decoration:underline; font-size:13px}
.btn-danger{color:var(--danger); border-color:var(--danger)}
.btn-sm{padding:6px 10px; font-size:12.5px}
.done-list{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:2px 14px}
.done-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px}
.done-row:last-child{border-bottom:none}
.done-text{flex:1; min-width:0; color:var(--fg-muted)}
.time{font-size:11.5px; color:var(--fg-muted); font-variant-numeric:tabular-nums; flex:0 0 auto}
.plus{font-size:12.5px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; flex:0 0 auto}

input,select{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 11px; font-size:16px; color:var(--fg); font-family:inherit; min-height:44px;
}
input[type=checkbox]{width:22px; height:22px; min-height:0; flex:0 0 auto; accent-color:var(--accent); padding:0}
label{font-size:12.5px; font-weight:700; color:var(--fg-muted); display:block; margin:14px 0 5px}
.row{display:flex; gap:10px; align-items:center}
.row>*{flex:1; min-width:0}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg-btn{flex:1 1 0; min-width:0; border:1.5px solid var(--border); background:var(--surface); border-radius:10px; padding:10px 6px; font-size:13.5px; font-weight:700; color:var(--fg-muted)}
.seg-btn.on{background:var(--cs, var(--surface-alt)); border-color:var(--c, var(--accent)); color:var(--c, var(--fg))}
.weekday-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.weekday-chip{border:1.5px solid var(--border); border-radius:8px; padding:8px 0; text-align:center; font-size:12px; font-weight:700; background:var(--surface); color:var(--fg-muted)}
.weekday-chip.on{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.hint{font-size:12px; color:var(--fg-muted); margin-top:5px}

.modal-wrap{position:fixed; inset:0; background:rgba(10,14,8,.5); z-index:20; display:flex; align-items:flex-end; justify-content:center}
@media (min-width:560px){.modal-wrap{align-items:center}}
.modal{
  background:var(--surface); border-radius:18px 18px 0 0; width:100%; max-width:480px;
  max-height:90vh; overflow-y:auto; padding:20px max(20px, env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));
}
@media (min-width:560px){.modal{border-radius:18px}}
.modal h2{font-size:19px; margin-bottom:4px}
.modal-sub{font-size:13px; color:var(--fg-muted); margin:0 0 6px}
.modal-section{border-top:1px solid var(--border); margin-top:18px; padding-top:4px}
.swatches{display:flex; gap:8px; flex-wrap:wrap}
.swatch{width:34px; height:34px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 1px var(--border)}
.swatch.on{box-shadow:0 0 0 2.5px var(--fg)}
.swatch:disabled{opacity:.25; cursor:not-allowed}
.switch-row{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; font-weight:500; color:var(--fg); margin:10px 0; text-transform:none}
.time-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.time-chip{display:inline-flex; align-items:center; gap:4px; background:var(--surface-alt); border-radius:99px; padding:4px 6px 4px 12px; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums}
.time-chip button{background:none; border:none; color:var(--fg-muted); font-size:16px; line-height:1; padding:2px 6px}
.whoami{display:flex; gap:10px; margin-top:12px}
.whoami-btn{flex:1; border-radius:14px; border:2px solid var(--border); background:var(--surface); padding:16px 8px; font-weight:700; font-size:15px; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--fg)}

.week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.week-nav-label{font-weight:700; font-size:15px; font-family:var(--font-display)}
.week-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px}
.week-day{border:1.5px solid var(--border); border-radius:10px; padding:6px 2px; background:var(--surface); min-height:96px; display:flex; flex-direction:column; align-items:center; gap:3px}
.week-day.is-today{border-color:var(--accent)}
.week-day.sel{background:var(--surface-alt); border-color:var(--fg)}
.week-day-head{font-size:10.5px; color:var(--fg-muted); font-weight:700; text-transform:uppercase}
.week-day-num{font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--fg)}
.week-chip{font-size:14px; line-height:1; padding:2px 2px 4px; border-bottom:3px solid transparent}
.week-chip.done{opacity:.35}
.day-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border)}
.day-row:last-child{border-bottom:none}

.hist-day{font-size:12px; font-weight:700; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px}
.hist-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-text{flex:1; font-size:14px; min-width:0}

.wager{background:var(--warn-soft); border-color:transparent}
.wager-text{font-family:var(--font-display); font-size:17px; font-weight:600; margin:4px 0 2px; color:var(--fg)}
.score-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.score-row{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin:14px 0 10px}
.score-side{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center}
.avatar-wrap{position:relative}
.crown{position:absolute; top:-15px; left:50%; transform:translateX(-50%) rotate(-8deg); font-size:20px}
.score-name{font-weight:700; font-size:14px}
.score-pts{font-family:var(--font-display); font-size:36px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.vs{font-family:var(--font-display); font-style:italic; color:var(--fg-muted); font-size:15px; padding:0 6px}
.split-bar{display:flex; height:12px; border-radius:99px; overflow:hidden; background:var(--surface-alt)}
.split-seg{height:100%; transition:width .4s}
.players{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.player{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; min-width:0}
.player-level{font-family:var(--font-display); font-size:15px; font-weight:700; line-height:1.2; margin:6px 0 2px}
.bar{height:7px; border-radius:99px; background:var(--surface-alt); overflow:hidden; margin:8px 0 6px}
.bar>span{display:block; height:100%; border-radius:99px}
.stat-line{font-size:12.5px; color:var(--fg-muted); display:flex; justify-content:space-between; gap:6px; font-variant-numeric:tabular-nums}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
.badge{border:1px solid var(--border); border-radius:12px; padding:10px; background:var(--surface)}
.badge-icon{font-size:24px}
.badge-name{font-weight:700; font-size:13.5px; margin-top:2px}
.badge-desc{font-size:11.5px; color:var(--fg-muted)}
.badge.locked .badge-icon{filter:grayscale(1); opacity:.4}
.badge.locked .badge-name{color:var(--fg-muted)}

.toast{
  position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--fg); color:var(--bg); padding:12px 14px; border-radius:12px; font-size:13.5px;
  z-index:30; text-align:center; max-width:480px; margin:0 auto;
}
#banner-root{position:fixed; top:calc(8px + env(safe-area-inset-top,0px)); left:12px; right:12px; z-index:35; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.banner{
  pointer-events:auto; width:100%; max-width:440px; display:flex; gap:10px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.18); animation:drop .3s ease-out;
}
.banner-text{display:flex; flex-direction:column; font-size:13.5px; min-width:0}
.banner-text span{color:var(--fg-muted)}
@keyframes drop{from{transform:translateY(-20px); opacity:0}to{transform:none; opacity:1}}
.float-pts{
  position:fixed; left:50%; top:42%; transform:translate(-50%,-50%); z-index:41; pointer-events:none;
  font-family:var(--font-display); font-weight:700; font-size:42px; color:var(--gold); text-align:center;
  animation:rise 1.4s ease-out forwards; text-shadow:0 2px 0 var(--surface);
}
.float-pts small{display:block; font-family:var(--font-body); font-size:13px; color:var(--fg-muted); font-weight:700}
@keyframes rise{0%{opacity:0; transform:translate(-50%,-30%) scale(.8)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0; transform:translate(-50%,-120%) scale(1)}}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}
@media (prefers-reduced-motion: reduce){
  .banner,.float-pts{animation:none}
  .split-seg{transition:none}
}
.onboard-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:24px 0}
.onboard-card{max-width:400px; width:100%}
.notice{background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px}
.demo-bar{background:var(--surface-alt); border-radius:12px; padding:10px 12px; font-size:12.5px; margin-bottom:14px; display:flex; flex-direction:column; gap:8px}
.demo-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.tour-block{position:fixed; inset:0; z-index:50}
.tour-spot{position:fixed; z-index:51; border-radius:14px; box-shadow:0 0 0 9999px rgba(8,12,6,.64); pointer-events:none; transition:top .25s ease, left .25s ease, width .25s ease, height .25s ease}
.tour-card{position:fixed; z-index:52; background:var(--surface); color:var(--fg); border-radius:16px; padding:16px 16px 12px; box-shadow:0 12px 40px rgba(0,0,0,.3)}
.tour-card h3{font-size:19px; margin:4px 0 6px}
.tour-card p{margin:0; font-size:14.5px; line-height:1.5}
.tour-step{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.tour-actions{display:flex; align-items:center; gap:6px; margin-top:14px}
.tour-final{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.tour-final .btn{width:100%; padding:12px}
.tour-dots{flex:1; display:flex; gap:4px; justify-content:center}
.tour-dots span{width:6px; height:6px; border-radius:50%; background:var(--border)}
.tour-dots span.on{background:var(--accent); width:14px; border-radius:99px}
@media (prefers-reduced-motion: reduce){ .tour-spot{transition:none} }
.empty-card{text-align:center; padding:26px 20px; margin-top:12px}
.empty-card h2{font-size:20px; margin:8px 0 6px}
.empty-card p{font-size:14px; color:var(--fg-muted); margin:0 auto 16px; max-width:34ch}
.empty-art{font-size:34px; letter-spacing:6px}
.danger-zone{background:var(--danger-soft); border-radius:12px; padding:12px; margin-top:12px; font-size:13.5px}
.push-box{background:var(--surface-alt); border-radius:12px; padding:12px; margin-top:12px; font-size:14px}
.steps{margin:6px 0 4px; padding-left:20px; font-size:13.5px; line-height:1.6}
</style>
</head>

/* ---------- small helpers ---------- */
function lsGet(k){ try{ return localStorage.getItem(STORE_PREFIX+k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(STORE_PREFIX+k, v); }catch(e){} }
var memMe = null;
function myPerson(){ return lsGet('myPerson') || memMe; }
function setMyPerson(p){ memMe = p; lsSet('myPerson', p); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pad(n){ return (n<10?'0':'')+n; }
function dateOnly(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return dateOnly(a).getTime()===dateOnly(b).getTime(); }
function todayDate(){ return dateOnly(new Date()); }
function dayKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(s){ var p=String(s).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
function hhmm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function minutesSince(tm){ var p=tm.split(':'); var t=new Date(); t.setHours(+p[0], +p[1], 0, 0); return (Date.now()-t.getTime())/60000; }
function fmtWeekday(d){ return d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.',''); }
function fmtDayMonth(d){ return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}).replace('.',''); }
function fmtTime(d){ return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtShortDay(d){
  var t = todayDate();
  if(sameDay(d,t)) return 'Hoy';
  if(sameDay(d,addDays(t,1))) return 'Mañana';
  if(sameDay(d,addDays(t,-1))) return 'Ayer';
  return cap(d.toLocaleDateString('es-ES',{weekday:'short', day:'numeric', month:'short'}).replace(/\./g,''));
}
function fmtFullDay(d){
  var t = todayDate();
  if(sameDay(d,t)) return 'Hoy';
  if(sameDay(d,addDays(t,-1))) return 'Ayer';
  return cap(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
}
function fv(form, name){ var el = form.elements.namedItem(name); return el ? el.value : ''; }

function personName(p){ var s=S(); return (p==='A'?s.nameA:s.nameB) || (p==='A'?'Persona A':'Persona B'); }
function personColor(p){ var s=S(); return (p==='A'?s.colorA:s.colorB) || (p==='A'?COLORS[0]:COLORS[1]); }
function initial(p){ return (personName(p).trim().charAt(0) || '?').toUpperCase(); }
function pVar(p){ return p==='A' ? 'var(--person-a)' : 'var(--person-b)'; }

/* ---------- tasks and schedule ---------- */
function activeTasks(){ return state.tasks.filter(function(t){ return t.active!==false; }); }
function taskById(id){ return state.tasks.find(function(t){ return t.id===id; }); }
function taskPoints(t){ return t.points || 10; }
function compPoints(c){ return typeof c.points==='number' ? c.points : 10; }
function taskStart(t){ return t.startDate ? parseDay(t.startDate) : dateOnly(new Date(t.createdAt || Date.now())); }
function lastCompletionFor(taskId){
  for(var i=0;i<state.completions.length;i++){ if(state.completions[i].taskId===taskId) return state.completions[i]; }
  return null;
}
function computeStatus(t){
  var last = lastCompletionFor(t.id);
  var lastDate = last ? new Date(last.completedAt) : null;
  var today = todayDate();
  var doneToday = !!(lastDate && sameDay(lastDate, today));
  var due;
  if(t.freqType==='once'){
    due = t.date ? parseDay(t.date) : taskStart(t);
    if(last) return {due:due, status: doneToday ? 'done_today' : 'finished', doneToday:doneToday};
  } else if(t.freqType==='daily'){
    due = lastDate ? addDays(dateOnly(lastDate),1) : taskStart(t);
  } else if(t.freqType==='weekly'){
    var wds = (t.weekdays && t.weekdays.length) ? t.weekdays : [1];
    due = lastDate ? addDays(dateOnly(lastDate),1) : taskStart(t);
    for(var i=0;i<8;i++){ if(wds.indexOf(due.getDay())!==-1) break; due = addDays(due,1); }
  } else {
    due = lastDate ? addDays(dateOnly(lastDate), Math.max(1, t.intervalDays||7)) : taskStart(t);
  }
  var status;
  if(doneToday) status = 'done_today';
  else if(due.getTime() < today.getTime()) status = 'overdue';
  else if(due.getTime() === today.getTime()) status = 'today';
  else status = 'upcoming';
  return {due:due, status:status, doneToday:doneToday};
}
function isScheduledOn(t, day){
  if(t.freqType==='once') return sameDay(t.date ? parseDay(t.date) : taskStart(t), day);
  var start = taskStart(t);
  if(day.getTime() < start.getTime()) return false;
  if(t.freqType==='daily') return true;
  if(t.freqType==='weekly'){
    var wds = (t.weekdays && t.weekdays.length) ? t.weekdays : [1];
    return wds.indexOf(day.getDay())!==-1;
  }
  var n = Math.max(1, t.intervalDays||7);
  var diff = Math.round((day.getTime()-start.getTime())/86400000);
  return diff % n === 0;
}
function isDoneOn(taskId, day){
  return state.completions.some(function(c){ return c.taskId===taskId && sameDay(new Date(c.completedAt), day); });
}
function freqLabel(t){
  if(t.freqType==='once') return fmtShortDay(t.date ? parseDay(t.date) : taskStart(t));
  if(t.freqType==='daily') return 'Todos los días';
  if(t.freqType==='weekly'){
    var wds = (t.weekdays && t.weekdays.length) ? t.weekdays : [1];
    return WEEKDAY_ORDER.filter(function(w){ return wds.indexOf(w)!==-1; }).map(function(w){ return WEEKDAY_LABEL[w]; }).join(', ');
  }
  return 'Cada '+(t.intervalDays||7)+' días';
}
function whoLabel(t){ return t.assignMode==='rotate' ? 'Turnan · le toca a '+personName(t.assignee) : personName(t.assignee); }

/* ---------- game ---------- */
function weekStart(d){ var x = dateOnly(d); return addDays(x, -((x.getDay()+6)%7)); }
function pointsBetween(p, from, to){
  var a = from.getTime(), b = to.getTime();
  return state.completions.reduce(function(sum, c){
    var t = new Date(c.completedAt).getTime();
    return (c.person===p && t>=a && t<b) ? sum + compPoints(c) : sum;
  }, 0);
}
function totalPoints(p){ return state.completions.reduce(function(s,c){ return c.person===p ? s+compPoints(c) : s; }, 0); }
function daySet(p){
  var set = {};
  state.completions.forEach(function(c){ if(c.person===p) set[dayKey(new Date(c.completedAt))] = true; });
  return set;
}
function currentStreak(p){
  var days = daySet(p), d = todayDate(), n = 0;
  if(!days[dayKey(d)]) d = addDays(d,-1);
  while(days[dayKey(d)]){ n++; d = addDays(d,-1); }
  return n;
}
function longestStreak(p){
  var keys = Object.keys(daySet(p)).sort(), best = 0, run = 0, prev = null;
  keys.forEach(function(k){
    var d = parseDay(k);
    run = (prev && sameDay(addDays(prev,1), d)) ? run+1 : 1;
    if(run>best) best = run;
    prev = d;
  });
  return best;
}
function levelInfo(pts){
  var lvl = Math.floor(pts/100) + 1;
  return { lvl:lvl, title: lvl <= LEVELS.length ? LEVELS[lvl-1] : LEVELS[LEVELS.length-1]+' '+(lvl-LEVELS.length+1), into: pts % 100 };
}
function badgesFor(p){
  var mine = state.completions.filter(function(c){ return c.person===p; });
  var pts = totalPoints(p);
  var helps = mine.filter(function(c){ return c.helped; }).length;
  var early = mine.filter(function(c){ return new Date(c.completedAt).getHours() < 9; }).length;
  var extras = mine.filter(function(c){ return c.extra; }).length;
  var best = longestStreak(p);
  return [
    {icon:'🌱', name:'Primer paso', desc:'Completa tu primera tarea', got: mine.length>=1},
    {icon:'🔥', name:'En racha', desc:'3 días seguidos', got: best>=3, prog: Math.min(best,3)+'/3'},
    {icon:'🏆', name:'Imparable', desc:'7 días seguidos', got: best>=7, prog: Math.min(best,7)+'/7'},
    {icon:'🤝', name:'Buen equipo', desc:'5 tareas de tu pareja', got: helps>=5, prog: Math.min(helps,5)+'/5'},
    {icon:'🌅', name:'Madrugador', desc:'5 tareas antes de las 9', got: early>=5, prog: Math.min(early,5)+'/5'},
    {icon:'✨', name:'Milla extra', desc:'3 cosas no planeadas', got: extras>=3, prog: Math.min(extras,3)+'/3'},
    {icon:'💯', name:'Centenario', desc:'100 puntos', got: pts>=100, prog: Math.min(pts,100)+'/100'},
    {icon:'👑', name:'Leyenda', desc:'500 puntos', got: pts>=500, prog: Math.min(pts,500)+'/500'}
  ];
}

/* ---------- celebration ---------- */
function celebrate(pts, note, person){
  var f = document.createElement('div');
  f.className = 'float-pts';
  f.innerHTML = '+'+pts+' pts'+(note ? '<small>'+esc(note)+'</small>' : '');
  document.body.appendChild(f);
  setTimeout(function(){ f.remove(); }, 1500);
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('confetti'), ctx = cv.getContext && cv.getContext('2d');
  if(!ctx) return;
  var w = cv.width = window.innerWidth, h = cv.height = window.innerHeight;
  var cols = [personColor(person||'A'), personColor(other(person||'A')), '#E3B74A', '#64C398'];
  var parts = [];
  for(var i=0;i<90;i++){
    parts.push({x:w/2, y:h*0.42, vx:(Math.random()-0.5)*12, vy:-Math.random()*11-4, s:Math.random()*6+4, r:Math.random()*6, vr:(Math.random()-0.5)*0.3, c:cols[i%cols.length]});
  }
  var start = performance.now();
  (function frame(now){
    var t = now - start;
    ctx.clearRect(0,0,w,h);
    parts.forEach(function(p){
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - t/1600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      ctx.restore();
    });
    if(t < 1600) requestAnimationFrame(frame); else ctx.clearRect(0,0,w,h);
  })(start);
}

/* ---------- notifications ---------- */
function showBanner(title, body){
  var root = document.getElementById('banner-root');
  var el = document.createElement('div');
  el.className = 'banner';
  el.innerHTML = '<div aria-hidden="true">🔔</div><div class="banner-text"><strong></strong><span></span></div>';
  el.querySelector('strong').textContent = title;
  el.querySelector('span').textContent = body || '';
  el.addEventListener('click', function(){ el.remove(); });
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 7000);
}
function notify(title, body){
  // With push on, the server sends these; showing them here too would duplicate them.
  if(!PREVIEW && lsGet('pushOn')==='1') return;
  showBanner(title, body);
  if(PREVIEW || !document.hidden || !('Notification' in window) || Notification.permission!=='granted') return;
  var opts = {body: body || '', icon:'icon-192.png', tag:'casa-'+title};
  if(navigator.serviceWorker && navigator.serviceWorker.controller){
    navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title, opts); })
      .catch(function(){ try{ new Notification(title, opts); }catch(e){} });
  } else {
    try{ new Notification(title, opts); }catch(e){}
  }
}
var firedMem = {};
function firedKey(id){ return 'fired_'+dayKey(todayDate())+'_'+id; }
function alreadyFired(id){ return firedMem[firedKey(id)] || lsGet(firedKey(id))==='1'; }
function markFired(id){ firedMem[firedKey(id)] = true; lsSet(firedKey(id), '1'); }

function checkReminders(){
  var me = myPerson();
  if(!me || !state.settings || !state.tasksLoaded || !state.completionsLoaded) return;
  var a = alertsFor(me), now = hhmm(new Date());
  var mine = activeTasks().filter(function(t){ return t.assignee===me; })
    .map(function(t){ return {t:t, st:computeStatus(t)}; })
    .filter(function(x){ return x.st.status==='today' || x.st.status==='overdue'; });
  document.title = (mine.length ? '('+mine.length+') ' : '') + 'La solución a nuestros problemas';
  var names = mine.slice(0,3).map(function(x){ return x.t.title; }).join(', ');

  a.times.forEach(function(tm){
    if(now >= tm && !alreadyFired('time'+tm)){
      markFired('time'+tm);
      if(mine.length && minutesSince(tm) < 60) notify(mine.length===1 ? 'Tienes 1 tarea pendiente' : 'Tienes '+mine.length+' tareas pendientes', names);
    }
  });
  if(a.atTaskTime){
    mine.forEach(function(x){
      if(x.t.time && x.st.status==='today' && now >= x.t.time && !alreadyFired('task'+x.t.id)){
        markFired('task'+x.t.id);
        if(minutesSince(x.t.time) < 60) notify('Es hora de: '+x.t.title, 'Vale '+taskPoints(x.t)+' puntos.');
      }
    });
  }
  if(a.overdue){
    var od = mine.filter(function(x){ return x.st.status==='overdue'; });
    if(od.length && !alreadyFired('overdue')){
      markFired('overdue');
      notify(od.length===1 ? 'Tienes 1 tarea atrasada' : 'Tienes '+od.length+' tareas atrasadas', od.slice(0,3).map(function(x){ return x.t.title; }).join(', '));
    }
  }
}
setInterval(checkReminders, 30000);

var knownTaskIds = null, checkedNewFor = null;
function detectNewTasks(){
  var me = myPerson();
  if(knownTaskIds && me){
    state.tasks.forEach(function(t){
      if(!knownTaskIds[t.id] && t.assignee===me && t.createdBy && t.createdBy!==me){
        ui.newTaskIds[t.id] = true;
        if(alertsFor(me).newTask) notify(personName(t.createdBy)+' te asignó una tarea', (t.icon||'')+' '+t.title+' · '+freqLabel(t)+(t.time?' a las '+t.time:''));
      }
    });
  }
  knownTaskIds = {};
  state.tasks.forEach(function(t){ knownTaskIds[t.id] = true; });
}
function checkNewSinceLastVisit(){
  var me = myPerson();
  if(!me || checkedNewFor===me || !state.tasksLoaded || !state.settings) return;
  checkedNewFor = me;
  var last = +(lsGet('lastSeen_'+me) || 0);
  if(last){
    var fresh = activeTasks().filter(function(t){
      return t.assignee===me && t.createdBy && t.createdBy!==me && new Date(t.createdAt).getTime() > last;
    });
    fresh.forEach(function(t){ ui.newTaskIds[t.id] = true; });
    if(fresh.length && alertsFor(me).newTask){
      var who = personName(fresh[0].createdBy);
      notify(fresh.length===1 ? who+' te asignó una tarea' : who+' te asignó '+fresh.length+' tareas', fresh.slice(0,3).map(function(t){ return t.title; }).join(', '));
    }
  }
  lsSet('lastSeen_'+me, String(Date.now()));
}

function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function pushSupported(){ return !PREVIEW && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function b64ToBytes(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); s += '==='.slice((s.length+3) % 4);
  var raw = atob(s), out = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function subDocId(endpoint){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint));
  return Array.from(new Uint8Array(buf)).slice(0,16).map(function(b){ return (b<16?'0':'')+b.toString(16); }).join('');
}
async function savePushSub(sub){
  var j = sub.toJSON(), id = await subDocId(j.endpoint);
  var ok = await withDb(async function(){
    await state.db.doc('pushSubs/'+id).set({ person: myPerson(), endpoint: j.endpoint, keys: j.keys, ua: navigator.userAgent.slice(0,120), updatedAt: new Date().toISOString() });
  });
  if(ok){ lsSet('pushOn','1'); lsSet('pushSubFor', id+'|'+myPerson()); }
  return ok;
}
async function enablePush(){
  if(PREVIEW){ toast('En la app real, aquí aparece el permiso de notificaciones del móvil.'); return; }
  if(!pushSupported()){
    if('Notification' in window) Notification.requestPermission().then(function(){ render(); });
    else toast('Este navegador no admite avisos.');
    return;
  }
  try{
    var perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('No se activaron los avisos'); render(); return; }
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription() ||
              await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY) });
    if(await savePushSub(sub)){
      reg.showNotification('Avisos activados', { body:'Así te llegarán los recordatorios de La solución.', icon:'icon-192.png', tag:'casa-prueba' });
      toast('Avisos activados en este móvil');
    }
  }catch(e){
    toast('No se pudieron activar los avisos. Intenta de nuevo.');
  }
  render();
}
async function disablePush(){
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(sub){
      var id = await subDocId(sub.toJSON().endpoint);
      await withDb(async function(){ await state.db.doc('pushSubs/'+id).delete(); });
      await sub.unsubscribe();
    }
  }catch(e){}
  lsSet('pushOn',''); lsSet('pushSubFor','');
  toast('Avisos desactivados en este móvil');

}
// Keeps the subscription tied to whoever uses this phone now.
async function refreshPushSub(){
  if(!pushSupported() || Notification.permission!=='granted' || !state.db || !myPerson()) return;
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){ lsSet('pushOn',''); return; }

    if(lsGet('pushSubFor') !== id+'|'+myPerson()) await savePushSub(sub);
    else lsSet('pushOn','1');
  }catch(e){}
}

/* ---------- background upkeep: last-done dates and timezone for the notifier ---------- */
var maintTimer = null;
function scheduleMaintenance(){ clearTimeout(maintTimer); maintTimer = setTimeout(runMaintenance, 1500); }
function runMaintenance(){
  if(!state.db || !state.settings || !state.tasksLoaded || !state.completionsLoaded) return;
  var lastBy = {};
  state.completions.forEach(function(c){ if(c.taskId && !lastBy[c.taskId]) lastBy[c.taskId] = c.completedAt; });
  var partial = state.completions.length >= 1000;
  state.tasks.forEach(function(t){
    var want = lastBy[t.id] || null;
    if(want===null && partial) return;

// Same API subset as Firestore compat, backed by localStorage (single device).
function makeLocalDb(){
  var KEY = STORE_PREFIX + 'local';
  var data = null;
  try{ data = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
  data = data || {};
  var listeners = [];
  function clone(v){ return v===undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function split(path){ var p = path.split('/'); return {col:p[0], id:p[1]}; }
  function colObj(col){ return data[col] || (data[col] = {}); }
  function docSnap(col, id){ var v = (data[col] || {})[id]; return {id:id, exists:!!v, data:function(){ return clone(v); }}; }
  function fire(l){
    if(l.type==='doc'){ var s = split(l.path); l.cb(docSnap(s.col, s.id)); return; }
    var docs = Object.keys(data[l.path] || {}).map(function(id){ return docSnap(l.path, id); });
    if(l.order){
      var f = l.order[0], sign = l.order[1]==='desc' ? -1 : 1;
      docs.sort(function(a,b){ var x=a.data()[f], y=b.data()[f]; return (x<y?-1:x>y?1:0)*sign; });
    }
    if(l.lim) docs = docs.slice(0, l.lim);
    l.cb({docs:docs});
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
    listeners.forEach(fire);
  }
  function sub(l){
    listeners.push(l);
    setTimeout(function(){ fire(l); }, 0);
    return function(){ listeners = listeners.filter(function(x){ return x!==l; }); };
  }
  function docRef(path){
    var s = split(path);
    return {
      id: s.id,
      set: function(v){ colObj(s.col)[s.id] = clone(v); save(); return Promise.resolve(); },
      update: function(v){
        var c = colObj(s.col);
        if(!c[s.id]) return Promise.reject({code:'not-found'});
        Object.assign(c[s.id], clone(v)); save(); return Promise.resolve();
      },
      delete: function(){ delete colObj(s.col)[s.id]; save(); return Promise.resolve(); },
      onSnapshot: function(cb){ return sub({type:'doc', path:path, cb:cb}); }
    };
  }
  function query(col, order, lim){
    return {
      orderBy: function(f, d){ return query(col, [f, d||'asc'], lim); },
      limit: function(n){ return query(col, order, n); },
      onSnapshot: function(cb){ return sub({type:'col', path:col, cb:cb, order:order, lim:lim}); },
      add: function(v){
        var id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
        colObj(col)[id] = clone(v); save();
        return Promise.resolve(docRef(col+'/'+id));
      },
      doc: function(id){ return docRef(col+'/'+id); }
    };
  }
  return {
    doc: docRef,
    collection: function(c){ return query(c, null, null); }
  };
}

// Live updates from the other phone must not wipe a form someone is typing in.
var pendingRender = false;
function isEditing(){
  var a = document.activeElement;
  return !!(a && a.form && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type!=='checkbox');
}
function renderFromData(){
  if(isEditing()){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', function(){
  setTimeout(function(){ if(pendingRender && !isEditing()){ pendingRender = false; render(); } }, 400);
});

function subscribeAll(db){
  state.db = db;
  function onErr(err){ state.dbError = err || {}; render(); }
  db.doc('settings/general').onSnapshot(function(snap){
    state.settingsLoaded = true;
    state.settings = snap.exists ? snap.data() : null;
    renderFromData();
    scheduleMaintenance();
  }, onErr);
  db.collection('tasks').onSnapshot(function(qs){
    state.tasksLoaded = true;
    state.tasks = qs.docs.map(function(d){ var v=d.data(); v.id=d.id; return v; });
    detectNewTasks();
    renderFromData();
    scheduleMaintenance();
  }, onErr);
  db.collection('completions').orderBy('completedAt','desc').limit(1000).onSnapshot(function(qs){
    state.completionsLoaded = true;
    state.completions = qs.docs.map(function(d){ var v=d.data(); v.id=d.id; return v; });
    renderFromData();
    scheduleMaintenance();
  }, onErr);
}

function connectDb(){
  if(PREVIEW){
    state.localMode = true;
    var ldb = makeLocalDb();
    if(!myPerson()) setMyPerson('A');
    subscribeAll(ldb);
    return;
  }
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}
  firebase.auth().onAuthStateChanged(function(user){
    state.user = user;
    state.authChecked = true;
    if(user && !state.db) subscribeAll(firebase.firestore());
    render();
  });
}

function renderHistorial(){
  if(!state.completions.length) return '<div class="empty">Todavía no se ha marcado ninguna tarea.</div>';
  var byDay = {}, order = [];
  state.completions.forEach(function(c){
    var key = dateOnly(new Date(c.completedAt)).getTime();
    if(!byDay[key]){ byDay[key] = []; order.push(key); }
    byDay[key].push(c);
  });
  return order.slice(0, 30).map(function(key){
    var rows = byDay[key].map(function(c){
      var confirming = ui.confirmDelCompletion === c.id;
      return '<div class="hist-row">'+avatar(c.person, 24)+
        '<span class="hist-text">'+esc(c.taskIcon||'📌')+' '+esc(c.taskTitle)+
          (c.extra?' <span class="pill pill-extra">extra</span>':'')+(c.helped?' <span class="pill pill-help">ayudó</span>':'')+
          '<br><span class="muted">'+esc(personName(c.person))+' · '+fmtTime(new Date(c.completedAt))+'</span></span>'+
        '<span class="plus">+'+compPoints(c)+'</span>'+
        (confirming
          ? '<button class="btn btn-sm btn-danger" data-action="confirm-del-completion" data-id="'+c.id+'">Borrar</button><button class="btn-ghost" data-action="cancel-del-completion">No</button>'
          : '<button class="btn-ghost" data-action="ask-del-completion" data-id="'+c.id+'" aria-label="Borrar registro">✕</button>')+
      '</div>';
    }).join('');
    return '<div class="hist-day">'+fmtFullDay(new Date(key))+'</div><div class="card" style="padding:2px 14px">'+rows+'</div>';
  }).join('');
}

function goTab(tab){
  if(ui.tab===tab) return;
  ui.tab = tab; ui.selDay = null;
  render();
  window.scrollTo(0,0);
}
var tourOffered = {};
function maybeStartTour(){
  var me = myPerson();
  if(!me || ui.tour || ui.modal || ui.tab!=='hoy' || tourOffered[me] || lsGet('tourDone_'+me)) return;
  tourOffered[me] = true;
  setTimeout(function(){ if(!ui.modal && !ui.tour) startTour(); }, 500);
}
function startTour(){
  goTab('hoy');
  window.scrollTo(0,0);
  ui.tour = {i:0};
  showTourStep();
}
function endTour(backTo){
  if(myPerson()) lsSet('tourDone_'+myPerson(), '1');
  ui.tour = null;
  document.getElementById('tour-root').innerHTML = '';
  if(backTo) goTab(backTo);
}
function tourTarget(){
  var s = TOUR_STEPS[ui.tour.i];
  return s.target ? document.querySelector(s.target) : null;
}
function showTourStep(){
  var i = ui.tour.i, s = TOUR_STEPS[i], n = TOUR_STEPS.length;
  if(s.tab) goTab(s.tab);
  var el = tourTarget();
  if(el && !el.closest('#topbar')){
    var r = el.getBoundingClientRect();
    if(r.top < 110 || r.bottom > window.innerHeight - 220) window.scrollTo(0, Math.max(0, window.scrollY + r.top - 140));
  }
  var dots = ''; for(var k=0;k<n;k++) dots += '<span'+(k===i?' class="on"':'')+'></span>';
  document.getElementById('tour-root').innerHTML =
    '<div class="tour-block"></div><div class="tour-spot"></div>'+
    '<div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">'+
      '<div class="tour-step">'+(i+1)+' de '+n+'</div>'+
      '<h3 id="tour-title">'+s.title()+'</h3><p>'+s.text()+'</p>'+
      '<div class="'+(s.final ? 'tour-final' : 'tour-actions')+'">'+
        (s.final
          ? (activeTasks().length
              ? '<button class="btn btn-primary" data-action="tour-next">Empezar</button>'
              : '<button class="btn btn-primary" data-action="tour-create">Crear la primera tarea</button>')+
            '<button class="btn" data-action="tour-settings">Activar mis avisos</button>'
          : (i===0 ? '<button class="btn-ghost" data-action="tour-skip">Saltar</button>' : '<button class="btn-ghost" data-action="tour-back">Atrás</button>')+
            '<span class="tour-dots">'+dots+'</span><button class="btn btn-primary" data-action="tour-next">'+(i===0?'Empezar tour':'Siguiente')+'</button>')+
      '</div>'+
    '</div>';
  placeTour();
  var next = document.querySelector('.tour-card [data-action="tour-next"]');
  if(next) next.focus({preventScroll:true});
}
function placeTour(){
  if(!ui.tour) return;
  var spot = document.querySelector('.tour-spot'), card = document.querySelector('.tour-card');
  if(!spot || !card) return;
  var vw = window.innerWidth, vh = window.innerHeight, pad = 6;
  var cw = Math.min(340, vw - 32);
  card.style.width = cw + 'px';
  var ch = card.offsetHeight, el = tourTarget();
  if(!el){
    spot.style.top = (vh/2)+'px'; spot.style.left = (vw/2)+'px'; spot.style.width = '0px'; spot.style.height = '0px';
    card.style.left = ((vw-cw)/2)+'px'; card.style.top = Math.max(16, (vh-ch)/2)+'px';
    return;
  }
  var r = el.getBoundingClientRect();
  spot.style.top = (r.top-pad)+'px'; spot.style.left = (r.left-pad)+'px';
  spot.style.width = (r.width+pad*2)+'px'; spot.style.height = (r.height+pad*2)+'px';
  var top = r.bottom + pad + 12;
  if(top + ch > vh - 12) top = r.top - pad - 12 - ch;
  if(top < 12) top = Math.max(12, vh - ch - 12);
  var left = Math.min(Math.max(16, r.left + r.width/2 - cw/2), vw - cw - 16);
  card.style.top = top+'px'; card.style.left = left+'px';
}
window.addEventListener('resize', placeTour);
window.addEventListener('scroll', placeTour, {passive:true});
document.addEventListener('keydown', function(e){
  if(!ui.tour) return;
  if(e.key==='Escape'){ endTour('hoy'); }
  else if(e.key==='ArrowRight'){ document.querySelector('.tour-card [data-action="tour-next"]').click(); }
  else if(e.key==='ArrowLeft' && ui.tour.i>0){ ui.tour.i--; showTourStep(); }
});

      segButtons('points', POINTS.map(function(p){ return {v:String(p.v), label:p.label+' · '+p.v}; }), String(taskPoints(d)))+
      '<div class="row" style="margin-top:20px">'+
        '<button type="submit" class="btn btn-primary">'+(t?'Guardar':'Crear tarea')+'</button>'+
        '<button type="button" class="btn" data-action="close-modal">Cancelar</button>'+
      '</div>'+
      (t ? '<div style="margin-top:12px; text-align:center">'+
        '<button type="button" class="btn-ghost" data-action="ask-del-task">Eliminar tarea</button>'+
        '<span id="del-confirm" class="hidden"><span class="muted">¿Seguro? </span><button type="button" class="btn btn-sm btn-danger" data-action="confirm-del-task" data-id="'+t.id+'">Sí, eliminar</button> <button type="button" class="btn-ghost" data-action="cancel-del-task">No</button></span>'+
      '</div>' : '')+
    '</form>'+
  '</div></div>';
}
function syncTaskForm(form){
  if(!form) return;
  var f = fv(form, 'freqType'), who = fv(form, 'who');
  form.querySelectorAll('[data-show]').forEach(function(el){ el.classList.toggle('hidden', el.getAttribute('data-show').split(' ').indexOf(f)===-1); });
  form.querySelectorAll('[data-show-who]').forEach(function(el){ el.classList.toggle('hidden', who!=='R'); });
}

function renderExtraModal(){
  var who = ui.form.who || myPerson() || 'A';
  return '<div class="modal-wrap" data-action="backdrop"><div class="modal" role="dialog" aria-label="Registrar algo que hice">'+
    '<h2>Registrar algo que hice</h2>'+
    '<p class="modal-sub">Para lo que no estaba planeado. Suma puntos y queda en el historial.</p>'+
    '<form id="extra-form" data-action="submit-extra">'+
      '<label for="ex-title">¿Qué hiciste?</label>'+
      '<input id="ex-title" name="title" list="ex-suggest" placeholder="Limpiar el refri" required maxlength="60" autocomplete="off">'+
      '<datalist id="ex-suggest">'+activeTasks().map(function(t){ return '<option value="'+esc(t.title)+'">'; }).join('')+'</datalist>'+
      '<label>¿Quién?</label>'+
      segButtons('person', [{v:'A', label:esc(personName('A')), person:'A'}, {v:'B', label:esc(personName('B')), person:'B'}], who)+
      '<label for="ex-day">¿Cuándo?</label>'+
      '<select id="ex-day" name="day"><option value="0">Hoy</option><option value="1">Ayer</option><option value="2">Antier</option></select>'+
      '<label>¿Cuánto costó?</label>'+
      segButtons('points', POINTS.map(function(p){ return {v:String(p.v), label:p.label+' · '+p.v}; }), '10')+
      '<div class="hint">Si es una tarea que ya existe, vale sus puntos de siempre.</div>'+
      '<div class="row" style="margin-top:20px">'+
        '<button type="submit" class="btn btn-primary">Registrar</button>'+
        '<button type="button" class="btn" data-action="close-modal">Cancelar</button>'+
      '</div>'+
    '</form>'+
  '</div></div>';
}

function renderSettingsModal(){
  var s = S(), me = myPerson(), a = alertsFor(me);
  function swatches(p){
    var mine = personColor(p), theirs = personColor(other(p));
    return '<div class="swatches">'+COLORS.map(function(c){
      var taken = c===theirs;
      return '<button type="button" class="swatch'+(c===mine?' on':'')+'" style="background:'+c+'" data-action="pick-color" data-person="'+p+'" data-color="'+c+'"'+(taken?' disabled aria-label="Ya lo usa '+esc(personName(other(p)))+'"':' aria-label="Elegir color"')+'></button>';
    }).join('')+'</div>';
  }
  return '<div class="modal-wrap" data-action="backdrop"><div class="modal" role="dialog" aria-label="Ajustes">'+
    '<h2>Ajustes</h2>'+
    '<div class="modal-section" style="border-top:none; margin-top:4px">'+
      '<label>Mis avisos ('+esc(personName(me))+')</label>'+
      '<p class="modal-sub">Te recordamos tus tareas pendientes a estas horas:</p>'+
      '<div class="time-chips">'+(a.times.length ? a.times.map(function(tm){
        return '<span class="time-chip">'+esc(tm)+'<button type="button" data-action="remove-time" data-time="'+esc(tm)+'" aria-label="Quitar '+esc(tm)+'">×</button></span>';
      }).join('') : '<span class="muted">Sin recordatorios diarios</span>')+'</div>'+
      '<div class="row"><input id="new-time" type="time" value="20:00" aria-label="Nueva hora"><button type="button" class="btn" style="flex:0 0 auto" data-action="add-time">Añadir hora</button></div>'+
      '<label class="switch-row"><span>A la hora de cada tarea (si tiene hora)</span><input type="checkbox" data-alert="atTaskTime"'+(a.atTaskTime?' checked':'')+'></label>'+
      '<label class="switch-row"><span>Cuando una tarea mía se atrase</span><input type="checkbox" data-alert="overdue"'+(a.overdue?' checked':'')+'></label>'+
      '<label class="switch-row"><span>Cuando '+esc(personName(other(me)))+' me asigne una tarea</span><input type="checkbox" data-alert="newTask"'+(a.newTask?' checked':'')+'></label>'+
      renderPushControls()+
    '</div>'+
    '<div class="modal-section">'+
      '<label>Colores</label>'+
      '<p class="modal-sub">'+avatar('A',18)+' '+esc(personName('A'))+'</p>'+swatches('A')+
      '<p class="modal-sub" style="margin-top:12px">'+avatar('B',18)+' '+esc(personName('B'))+'</p>'+swatches('B')+
    '</div>'+
    '<div class="modal-section">'+
      '<form data-action="submit-names">'+
        '<div class="row">'+
          '<div><label for="st-a">Nombre 1</label><input id="st-a" name="nameA" value="'+esc(s.nameA)+'" required maxlength="24"></div>'+
          '<div><label for="st-b">Nombre 2</label><input id="st-b" name="nameB" value="'+esc(s.nameB)+'" required maxlength="24"></div>'+
        '</div>'+
        '<button type="submit" class="btn" style="width:100%; margin-top:10px">Guardar nombres</button>'+
      '</form>'+
      '<label>Este móvil es de</label>'+
      '<div class="whoami" style="margin-top:0">'+['A','B'].map(function(p){
        return '<button type="button" class="whoami-btn" style="padding:10px 8px; flex-direction:row; justify-content:center;'+(me===p?' border-color:'+pVar(p):'')+'" data-action="set-me" data-person="'+p+'">'+avatar(p,24)+esc(personName(p))+'</button>';
      }).join('')+'</div>'+
    '</div>'+
    '<div class="modal-section">'+
      '<label>Empezar de cero</label>'+
      '<p class="modal-sub">Borra todas las tareas y el historial para los dos. Los nombres, colores y avisos se quedan.</p>'+
      '<button type="button" class="btn btn-danger" style="width:100%" data-action="ask-reset">Borrar tareas e historial</button>'+
      '<div id="reset-confirm" class="danger-zone hidden"><strong>¿Seguro?</strong> Se borrarán '+state.tasks.length+' tareas y '+state.completions.length+' registros, para los dos. No se puede deshacer.'+
        '<div class="row" style="margin-top:10px"><button type="button" class="btn btn-danger" data-action="confirm-reset">Sí, borrar todo</button><button type="button" class="btn" data-action="cancel-reset">Cancelar</button></div>'+
      '</div>'+
    '</div>'+
    '<button type="button" class="btn" style="width:100%; margin-top:20px" data-action="close-modal">Cerrar</button>'+
    '<button type="button" class="btn-ghost" style="width:100%; margin-top:8px" data-action="start-tour">Ver el tour otra vez</button>'+
    (state.user ? '<button type="button" class="btn-ghost" style="width:100%; margin-top:8px" data-action="sign-out">Cerrar sesión ('+esc(state.user.email)+')</button>' : '')+
  '</div></div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var a = el.getAttribute('data-action');
  var form;
  switch(a){
    case 'set-tab': ui.tab = el.getAttribute('data-tab'); window.scrollTo(0,0); render(); break;
    case 'open-settings': openModal('settings'); break;
    case 'close-modal': closeModal(); render(); break;
    case 'backdrop': if(el===e.target){ closeModal(); render(); } break;
    case 'set-me': setMyPerson(el.getAttribute('data-person')); checkedNewFor = null; render(); refreshPushSub(); break;
    case 'filter': ui.filter = el.getAttribute('data-filter'); render(); break;
    case 'open-extra': openModal('extra', {who: myPerson()}); break;
    case 'open-task': openModal('task', {id: el.getAttribute('data-id') || null, date: el.getAttribute('data-date') || null}); break;
    case 'seg':
      form = el.closest('form');
      var name = el.getAttribute('data-name');
      form.querySelector('input[name="'+name+'"]').value = el.getAttribute('data-value');
      form.querySelectorAll('[data-action="seg"][data-name="'+name+'"]').forEach(function(b){ b.classList.toggle('on', b===el); });
      syncTaskForm(form.id==='task-form' ? form : null);
      break;
    case 'toggle-weekday':
      form = el.closest('form');
      var hidden = form.querySelector('input[name="weekdays"]');
      var day = el.getAttribute('data-day');
      var cur = hidden.value ? hidden.value.split(',').filter(Boolean) : [];
      var idx = cur.indexOf(day);
      if(idx===-1) cur.push(day); else cur.splice(idx,1);
      hidden.value = cur.join(',');
      el.classList.toggle('on');
      break;
    case 'ask-del-task': el.classList.add('hidden'); document.getElementById('del-confirm').classList.remove('hidden'); break;
    case 'cancel-del-task': document.getElementById('del-confirm').classList.add('hidden'); el.closest('div').querySelector('[data-action="ask-del-task"]').classList.remove('hidden'); break;
    case 'confirm-del-task': deleteTask(el.getAttribute('data-id')); break;
    case 'mark-done':
      var task = taskById(el.getAttribute('data-task'));
      if(task){ el.disabled = true; markDone(task, el.getAttribute('data-person')); }
      break;
    case 'ask-del-completion': ui.confirmDelCompletion = el.getAttribute('data-id'); render(); break;
    case 'cancel-del-completion': ui.confirmDelCompletion = null; render(); break;
    case 'confirm-del-completion': deleteCompletion(el.getAttribute('data-id')); break;
    case 'week-prev': ui.weekOffset--; ui.selDay = null; render(); break;
    case 'week-next': ui.weekOffset++; ui.selDay = null; render(); break;
    case 'week-today': ui.weekOffset = 0; ui.selDay = null; render(); break;
    case 'select-day': ui.selDay = el.getAttribute('data-day'); render(); break;
    case 'set-period': ui.statsPeriod = el.getAttribute('data-period'); render(); break;
    case 'badge-person': ui.badgePerson = el.getAttribute('data-person'); render(); break;
    case 'edit-wager': ui.editingWager = true; render(); var wi = document.getElementById('wager-input'); if(wi) wi.focus(); break;
    case 'cancel-wager': ui.editingWager = false; render(); break;
    case 'pick-color':
      var patch = {}; patch[el.getAttribute('data-person')==='A' ? 'colorA' : 'colorB'] = el.getAttribute('data-color');
      updateSettings(patch);
      break;
    case 'remove-time':
      var tm = el.getAttribute('data-time');
      saveAlerts(myPerson(), {times: alertsFor(myPerson()).times.filter(function(x){ return x!==tm; })});
      break;
    case 'add-time':
      var v = document.getElementById('new-time').value;
      if(!/^\d\d:\d\d$/.test(v)){ toast('Elige una hora'); break; }
      var times = alertsFor(myPerson()).times.filter(function(x){ return x!==v; }).concat([v]).sort();
      saveAlerts(myPerson(), {times: times});
      break;
    case 'tour-next':
      if(ui.tour.i >= TOUR_STEPS.length-1) endTour('hoy'); else { ui.tour.i++; showTourStep(); }
      break;
    case 'tour-back': ui.tour.i = Math.max(0, ui.tour.i-1); showTourStep(); break;
    case 'tour-skip': endTour('hoy'); break;
    case 'tour-settings': endTour('hoy'); openModal('settings'); break;
    case 'tour-create': endTour('tareas'); openModal('task', {}); break;
    case 'start-tour': closeModal(); startTour(); break;
    case 'ask-reset': el.classList.add('hidden'); document.getElementById('reset-confirm').classList.remove('hidden'); break;
    case 'cancel-reset':
      document.getElementById('reset-confirm').classList.add('hidden');
      document.querySelector('[data-action="ask-reset"]').classList.remove('hidden');
      break;
    case 'confirm-reset': el.disabled = true; resetAll(); break;
    case 'demo-seed': seedPreview(state.db); break;
    case 'enable-notif': enablePush(); break;
    case 'disable-push': disablePush(); break;
    case 'sign-out': firebase.auth().signOut().then(function(){ location.reload(); }); break;
    case 'demo-as': setMyPerson(el.getAttribute('data-person')); checkedNewFor = null; ui.badgePerson = null; render(); break;
    case 'demo-assign': demoAssign(); break;
    case 'demo-reset':
      try{ localStorage.removeItem(STORE_PREFIX+'local'); }catch(err){}
      location.reload();
      break;
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.name==='freqType') syncTaskForm(t.form);
  if(t.getAttribute && t.getAttribute('data-alert')){
    var patch = {}; patch[t.getAttribute('data-alert')] = t.checked;
    saveAlerts(myPerson(), patch);
  }
});

document.addEventListener('submit', function(e){
  e.preventDefault();
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  var f = e.target, a = f.getAttribute('data-action');
  if(a==='submit-login'){
    var errEl = document.getElementById('login-error');
    errEl.textContent = '';
    firebase.auth().signInWithEmailAndPassword(fv(f,'email').trim(), fv(f,'password')).catch(function(err){
      var c = (err && err.code) || '';
      if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) errEl.textContent = 'Correo o contraseña incorrectos.';
      else if(c==='auth/too-many-requests') errEl.textContent = 'Demasiados intentos. Espera unos minutos.';
      else errEl.textContent = 'No se pudo entrar. Revisa tu conexión.';
    });
  } else if(a==='submit-onboard'){
    var nA = fv(f,'nameA').trim(), nB = fv(f,'nameB').trim();
    if(!nA || !nB) return;
    withDb(async function(){
      await state.db.doc('settings/general').set({ nameA:nA, nameB:nB, colorA:COLORS[0], colorB:COLORS[1], createdAt:new Date().toISOString() });
    }).then(function(){ document.getElementById('modal-root').innerHTML = ''; render(); });
  } else if(a==='submit-names'){
    var x = fv(f,'nameA').trim(), y = fv(f,'nameB').trim();
    if(x && y){ updateSettings({nameA:x, nameB:y}); toast('Nombres guardados'); }
  } else if(a==='submit-wager'){
    ui.editingWager = false;
    updateSettings({wager: fv(f,'wager').trim()});
    render();
  } else if(a==='submit-extra'){
    var title = fv(f,'title').trim();
    if(!title) return;
    var when = new Date(), back = parseInt(fv(f,'day'),10) || 0;
    if(back){ when = addDays(when, -back); when.setHours(12,0,0,0); }
    saveExtra(title, fv(f,'person'), when, parseInt(fv(f,'points'),10) || 10);
  } else if(a==='submit-task'){
    var id = f.getAttribute('data-id') || null;
    var freq = fv(f,'freqType'), who = fv(f,'who');
    var data = {
      title: fv(f,'title').trim(),
      icon: fv(f,'icon').trim() || '📌',
      freqType: freq,
      time: fv(f,'time') || '',
      points: parseInt(fv(f,'points'),10) || 10,
      assignMode: who==='R' ? 'rotate' : 'fixed',
      assignee: who==='R' ? fv(f,'first') : who,
      active: true
    };
    if(!data.title){ toast('Ponle nombre a la tarea'); return; }
    var today = dayKey(todayDate());
    if(freq==='once') data.date = fv(f,'date') || today;
    else data.startDate = fv(f,'startDate') || today;
    if(freq==='weekly'){
      data.weekdays = fv(f,'weekdays').split(',').filter(Boolean).map(Number);
      if(!data.weekdays.length){ toast('Elige al menos un día'); return; }
    }
    if(freq==='custom') data.intervalDays = Math.max(1, parseInt(fv(f,'intervalDays'),10) || 7);
    saveTaskData(data, id);
  }
});

if(!PREVIEW && 'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
connectDb();
render();
</script>
